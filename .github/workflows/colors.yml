name: Farbdaten aktualisieren

on:
  schedule:
    - cron: "0 4 * * 1"   # jeden Montag 04:00 UTC
  workflow_dispatch:       # oder per Knopf auf GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_colors.py
      - name: Commit, falls sich etwas geändert hat
        run: |
          git diff --quiet -- LegoScanner/colors.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Farbdaten aktualisiert"
          git push
