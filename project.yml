name: LegoScanner
options:
  bundleIdPrefix: de.brockerhoff
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
targets:
  LegoScanner:
    type: application
    platform: iOS
    sources: [LegoScanner]
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: LegoScanner/Info.plist
      properties:
        CFBundleDisplayName: LegoScanner
        CFBundleDevelopmentRegion: de
        NSCameraUsageDescription: "Zum Fotografieren von LEGO-Teilen."
        BackendURL: "https://legoscanner-backend.vercel.app/api/identify"
        # aus Secrets.xcconfig (nicht im Repo): APP_KEY = <derselbe Wert wie die Vercel-Variable APP_KEY>
        AppKey: "$(APP_KEY)"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.brockerhoff.LegoScanner
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 9AAP484MH8
        CODE_SIGN_STYLE: Automatic
